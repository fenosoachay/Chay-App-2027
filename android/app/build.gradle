apply plugin: 'com.android.application'

// ── Signature release ─────────────────────────────────────────────────────────
// Fichier HORS dépôt (jamais dans git) : C:\Secrets-Chay\keystore.properties, ou le chemin donné par la variable
// d'environnement CHAY_KEYSTORE_PROPERTIES. Clés attendues : storeFile, storePassword, keyAlias, keyPassword.
// Les valeurs ne sont lues que par Gradle au moment de la construction ; elles ne sont jamais affichées ici.
def keystorePropertiesFile = file(System.getenv('CHAY_KEYSTORE_PROPERTIES') ?: 'C:/Secrets-Chay/keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigningReady = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { keystoreProperties.getProperty(it) }

android {
    namespace = "io.chay.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.chay.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 52
        versionName "1.4.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 1.4.1 : false = APK du site (mise à jour par téléchargement) ; true = version Google Play (type « play »).
        buildConfigField "boolean", "PLAY_STORE", "false"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            jniDebuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
        // 1.4.1 : version Google Play (AAB : gradlew bundlePlay). Même clé de signature que l'APK du site.
        // Sans la permission d'installer des applications (src/play/AndroidManifest.xml) ; mises à jour par
        // Google Play (écran « Mise à jour requise » de Google, ChayMiseAJourPlugin).
        play {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField "boolean", "PLAY_STORE", "true"
        }
    }
}

// Une construction release sans signature valide s'arrête (jamais d'APK release non signé ou signé en debug).
gradle.taskGraph.whenReady { graph ->
    def releaseDemandee = graph.allTasks.any { it.project == project && (it.name.toLowerCase().contains('release') || it.name.toLowerCase().contains('play')) }
    if (releaseDemandee && !releaseSigningReady) {
        throw new GradleException(
            "Signature release : fichier ${keystorePropertiesFile} absent ou incomplet " +
            "(clés attendues : storeFile, storePassword, keyAlias, keyPassword). Voir docs/android/SIGNATURE-RELEASE.md."
        )
    }
    if (releaseDemandee && !file(keystoreProperties.getProperty('storeFile')).exists()) {
        throw new GradleException("Signature release : le fichier storeFile indiqué dans ${keystorePropertiesFile} est introuvable.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
    implementation "androidx.media3:media3-session:1.4.1"
    // Diffusion sur Chromecast / Google TV / Android TV (ChromecastTv, CastOptionsProvider).
    implementation "com.google.android.gms:play-services-cast-framework:21.4.0"
    implementation "androidx.mediarouter:mediarouter:1.6.0"
    // ChayMessagingService (bulles) : même version que le plugin @capacitor/push-notifications.
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    // 1.4.0 : identifiants gardés dans le Gestionnaire de mots de passe Google (ChayIdentifiantsPlugin).
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    // 1.4.1 : mises à jour obligatoires de la version Google Play (sans effet dans l'APK du site).
    implementation "com.google.android.play:app-update:2.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
if (!servicesJSON.exists()) {
    throw new GradleException(
        "Firebase configuration is required for Android push notifications. " +
        "Add android/app/google-services.json from the Firebase Android app " +
        "registered with package ${android.defaultConfig.applicationId}."
    )
}

def firebaseConfig = new groovy.json.JsonSlurper().parse(servicesJSON)
def configuredPackages = (firebaseConfig.client ?: []).collect {
    it.client_info?.android_client_info?.package_name
}.findAll { it }
if (!configuredPackages.contains(android.defaultConfig.applicationId)) {
    throw new GradleException(
        "android/app/google-services.json has no Firebase Android client for " +
        "${android.defaultConfig.applicationId}. Register that exact package " +
        "name in Firebase and download its google-services.json."
    )
}
apply plugin: 'com.google.gms.google-services'
